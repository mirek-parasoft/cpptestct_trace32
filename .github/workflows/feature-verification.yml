name: Feature Verification

on:
  push:
    branches: [ 'feature*' ]

env:
  # Customize the CMake build type here (Release, Debug, RelWithDebInfo, etc.)
  BUILD_TYPE: Release
  BUILD_ID: build_3
  LINE_COV_GATE: 100
  MCDC_COV_GATE: 90
  
jobs:
  build:
    runs-on: self-hosted
    continue-on-error: true
     # Specifies required permissions for upload-sarif action
    permissions:
      # required for all workflows
      security-events: write
      # only required for workflows in private repositories
      actions: write
      contents: write
      pages: write
      pull-requests: write
      id-token: write

    steps:
    - uses: actions/checkout@v2

    - name: Create Build Environment
      # Some projects don't allow in-source building, so create a separate build directory
      # We'll use this as our working directory for all subsequent commands
      run: cmake -E make_directory ${{github.workspace}}/.build

    - name: Set build id
      shell: bash
      working-directory: ${{github.workspace}}
      run: echo "build_id=build-$(date +'%Y-%m-%d-%H-%M')" >> $GITHUB_ENV 

    - name: Echo build id
      shell: bash
      working-directory: ${{github.workspace}}
      run: echo "The new build id is ${{ env.build_id }}"

    - name: Configure CMake
      shell: bash
      working-directory: ${{github.workspace}}
      run: cmake -DCPPTEST_COVERAGE=ON -B.build -DCMAKE_EXPORT_COMPILE_COMMANDS=1 -DCMAKE_TOOLCHAIN_FILE=$PWD/arm-none-eabi-toolchain.cmake

    - name: Build 
      id: build 
      working-directory: ${{github.workspace}}
      shell: bash
      # Execute the build.  You can specify a specific target with "--target <NAME>"
      run: cmake --build .build -- VERBOSE=ON

    - name: Coverage Logs Cleanup
      working-directory: ${{github.workspace}}/.build
      shell: bash
      # Execute the build.  You can specify a specific target with "--target <NAME>"
      run: rm -rf cpptest-coverage/CovGoogleTest/CovGoogleTest.clog && rm -rf gtest_results.xml

    - name: Prepare shared C/C++test improvement branch
      id: prepare_cpptest_improvements
      shell: bash
      env:
        ORIGINAL_BRANCH: ${{ github.head_ref || github.ref_name }}
      run: |
        set -euo pipefail

        BRANCH_NAME="autofix/$ORIGINAL_BRANCH/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
        ORIGINAL_SHA=$(git rev-parse HEAD)
        git checkout -b "$BRANCH_NAME"

        echo "branch_name=$BRANCH_NAME" >> "$GITHUB_OUTPUT"
        echo "original_branch=$ORIGINAL_BRANCH" >> "$GITHUB_OUTPUT"
        echo "original_sha=$ORIGINAL_SHA" >> "$GITHUB_OUTPUT"

    # Runs code analysis with C/C++test.
    - name: Run C/C++test
      id: run_cpptest
      # Use the 'run-cpptest-action' GitHub action.
      uses: parasoft/run-cpptest-action@2
      # Optional parameters for 'run-cpptest-action'.
      with:
        # For CMake-based projects, use a compile_commands.json file as the input for analysis. 
        # input: .build/compile_commands.json
        # For Makefile-based projects, use a cpptestscan.bdf file as the input for analysis.
        input: .build/compile_commands.json
        testConfig: "MISRA C++ 2023.properties"
        compilerConfig: gcc_14-aarch64
        additionalParams: -fail -exclude */syscalls.cpp -exclude */comm-plugin/* -exclude */google*/* -exclude *_test.cpp
        # Uncomment if you are using C/C++test 2020.2 to generate a SARIF report:
        # reportFormat: xml,html,custom
        # additionalParams: '-property report.custom.extension=sarif -property report.custom.xsl.file=${PARASOFT_SARIF_XSL}'

    # Both AI steps commit to the shared improvement branch.
    - name: Run C/C++test AI Autofix
      id: run_cpptest_autofix
      if: always() && steps.prepare_cpptest_improvements.outcome == 'success' && steps.run_cpptest.outcome == 'failure'
      env:
        CPPTEST_COMMIT_FIXES: 1
        WORKFLOWS_DIR: ${{ github.workspace }}/.github/workflows
      run: |
        set -euo pipefail

        # Note: this requires "-fail" to be passed to run-cpptest-action,
        # and the "exitCode" output is available since version 2.0.3 of the action.
        exitCode=${{ steps.run_cpptest.outputs.exitCode }}
        if [ "$exitCode" -ge 130 ] || [ $((exitCode & 2)) -eq 0 ]; then
          echo "C/C++test exit code does not indicate violations. No autofix needed."
          exit 0
        fi

        # Run AI Agent to fix violations and commit changes
        "$WORKFLOWS_DIR/cpptest-agent-run.sh"

    - name: Run Unit Tests
      if: always() && steps.build.outcome == 'success'
      working-directory: ${{github.workspace}}/.build
      shell: bash
      # Execute the build.  You can specify a specific target with "--target <NAME>"
      run: ctest || true

    - name: Generate Coverage Reports
      id: cpptest_coverage
      if: always() && steps.build.outcome == 'success'
      working-directory: ${{github.workspace}}/.build
      shell: bash
      # Execute the build.  You can specify a specific target with "--target <NAME>"
      run: make cpptestcov-compute cpptestcov-suppress cpptestcov-report

    # Runs C/C++test AI test generation to automatically ensure high MC/DC coverage
    - name: Run C/C++test AI Tests Generation
      if: always() && steps.prepare_cpptest_improvements.outcome == 'success' && steps.build.outcome == 'success'
      id: run_cpptest_tests_gen
      env:
        CPPTEST_COMMIT_TESTS: true
        CPPTEST_ITERATION_LIMIT: 3
        WORKFLOWS_DIR: ${{ github.workspace }}/.github/workflows
      run: |
        set -euo pipefail

        mcdc_res=$(cpptestcov query -type percentage -coverage MCDC .coverage)
        if [ "$mcdc_res" -eq 100 ]; then
          echo "C/C++test already has 100% MC/DC coverage. No need to generate additional tests."
          exit 0
        fi

        # Run AI Agent to generate additional tests for uncovered MC/DC conditions
        "$WORKFLOWS_DIR/cpptest-agent-run-gen.sh"

    - name: Open combined C/C++test improvement pull request
      if: always() && steps.prepare_cpptest_improvements.outcome == 'success'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        BRANCH_NAME: ${{ steps.prepare_cpptest_improvements.outputs.branch_name }}
        ORIGINAL_BRANCH: ${{ steps.prepare_cpptest_improvements.outputs.original_branch }}
        ORIGINAL_SHA: ${{ steps.prepare_cpptest_improvements.outputs.original_sha }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
      run: |
        set -euo pipefail

        if [ "$(git rev-parse HEAD)" != "$ORIGINAL_SHA" ]; then
          git push -u origin "HEAD:refs/heads/$BRANCH_NAME"
          BRANCH_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/tree/$BRANCH_NAME"
          PR_URL=$(gh pr create --head "$BRANCH_NAME" --base "$ORIGINAL_BRANCH" --title "C/C++test AI improvements: $ORIGINAL_BRANCH" --body "Automated C/C++test static-analysis fixes and/or GoogleTest coverage improvements.")
          COMMENT=$(printf 'C/C++test opened one PR containing the committed AI Autofix and test-generation changes. Please review the changes and merge as appropriate.\nBranch: %s\nImprovement PR: %s' "$BRANCH_URL" "$PR_URL")
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            gh pr comment "$PR_NUMBER" --body "$COMMENT"
          else
            echo "$COMMENT"
          fi
        else
          echo "No C/C++test improvement commits were created. No pull request needed."
        fi
   
    - name: Prepare compliance report front page
      id: prepare_compliance_report
      if: always() && steps.cpptest_coverage.outcome == 'success'
      shell: bash
      working-directory: ${{github.workspace}}
      run: |
        cp -- helper/compliance_report.html helper/parasoft-logo.png .report/

    - name: Setup Pages
      if: always() && steps.prepare_compliance_report.outcome == 'success'
      uses: actions/configure-pages@v4

    - name: Upload artifact
      if: always() && steps.prepare_compliance_report.outcome == 'success'
      uses: actions/upload-pages-artifact@v4
      with:
        # Upload entire report directory
        path: ${{github.workspace}}/.report/
      
    - name: Deploy to GitHub Pages
      if: always() && steps.prepare_compliance_report.outcome == 'success'
      id: deployment
      uses: actions/deploy-pages@v4

    - name: Archive coverage
      if: always() && steps.cpptest_coverage.outcome == 'success'
      uses: actions/upload-artifact@v4
      with:
        name: CpptestCoverage
        path: ${{github.workspace}}/.coverage/

    - name: Check Line Coverage Gate
      if: always() && steps.cpptest_coverage.outcome == 'success'
      working-directory: ${{github.workspace}}
      shell: bash
      # Execute the build.  You can specify a specific target with "--target <NAME>"
      run: NUMBER=$(cpptestcov query -type percentage -coverage LC .coverage) && if [ $NUMBER -lt $LINE_COV_GATE ]; then echo "Line coverage quality gate failed"; echo "Expected result $LINE_COV_GATE%, echieved $NUMBER%"; echo "Check html report https://mirek-parasoft.github.io/cpptestct_trace32/coverage.html for details"; true; fi

    - name: Check MC/DC Coverage Gate
      if: always() && steps.cpptest_coverage.outcome == 'success'
      working-directory: ${{github.workspace}}
      shell: bash
      # Execute the build.  You can specify a specific target with "--target <NAME>"
      run: NUMBER=$(cpptestcov query -type percentage -coverage MCDC .coverage) && if [ $NUMBER -lt $MCDC_COV_GATE ]; then echo "MC/DC coverage quality gate failed"; echo "Expected result $MCDC_COV_GATE%, echieved $NUMBER%"; echo "Check html report https://mirek-parasoft.github.io/cpptestct_trace32/coverage.html for details"; true; fi
      
    - name: Print compliance report URL
      if: always() && steps.deployment.outcome == 'success'
      run: echo "https://mirek-parasoft.github.io/cpptestct_trace32/compliance_report.html"
    